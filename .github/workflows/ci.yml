name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 🚩 ДОБАВИЛИ Poetry
      - name: Install Poetry
        run: pip install poetry

      # 🚩 НАСТРОЙКА Poetry
      - name: Configure Poetry
        run: poetry config virtualenvs.create false

      # 🚩 УСТАНОВКА ЗАВИСИМОСТЕЙ (вместо pip)
      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      # 🚩 запускаем flake8 через poetry
      - name: Run Flake8
        run: poetry run flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 🚩 ДОБАВИЛИ Poetry
      - name: Install Poetry
        run: pip install poetry

      # 🚩 НАСТРОЙКА Poetry
      - name: Configure Poetry
        run: poetry config virtualenvs.create false

      # 🚩 ВМЕСТО requirements.txt
      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      # 🚩 через poetry
      - name: Run migrations
        run: poetry run python manage.py migrate

      # 🚩 через poetry
      - name: Run tests
        run: poetry run python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << EOF
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

            docker stop myapp || true
            docker rm myapp || true

            docker run -d --name myapp -p 80:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

            docker exec myapp python manage.py migrate

            docker exec myapp python manage.py collectstatic --noinput
          EOF